<style>
  :root{

  .dl{width:30px; flex:none; text-align:center}

  .sq{flex:1; aspect-ratio:1/1; border:.6pt solid #d5ccbb; border-radius:5px;
    position:relative; overflow:hidden; background:#fff}
  .cx{position:absolute; inset:0;
    background-image:linear-gradient(to right, transparent 49.5%, #ece4d5 49.5%, #ece4d5 50.5%, transparent 50.5%),
                     linear-gradient(to bottom, transparent 49.5%, #ece4d5 49.5%, #ece4d5 50.5%, transparent 50.5%)}

  label{display:block; font-size:12.5px; color:var(--ink-soft); margin:0 0 6px; letter-spacing:.02em}

    border:1px solid var(--line); background:#fffefb; color:var(--ink);

  }
  input[type=email]:focus{outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(44,62,107,.12)}
  button{
    width:100%; margin-top:14px; padding:14px 16px; border:none; border-radius:12px;
    background:var(--indigo); color:#fff; font-size:16px; font-weight:600;
    font-family:inherit; cursor:pointer; transition:.15s;
  }
  button:active{transform:scale(.985); opacity:.92}
  button[disabled]{opacity:.55; cursor:default}
  .note{font-size:12px; color:#8c8477; margin-top:10px; line-height:1.6}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
  .msg{margin-top:14px; font-size:14px; border-radius:12px; padding:12px 14px; display:none}
  .msg.show{display:block}
  .msg.ok{background:#eef6f0; color:var(--ok); border:1px solid #cfe3d7}
  .msg.err{background:#fbeeed; color:var(--red); border:1px solid #f0cfcb}
  .msg a{color:inherit; font-weight:600}
  .foot{margin-top:18px; font-size:11.5px; color:#9a9285; text-align:center; line-height:1.8}
  .foot a{color:#8c8477}
  .done{display:none; text-align:center; padding:8px 4px 4px}
  .done .tick{font-size:34px; line-height:1; margin-bottom:8px}
  .done h2{font-size:18px; margin:0 0 8px; font-family:"Noto Serif TC",serif}
  .done p{margin:0; font-size:14px; color:var(--ink-soft)}

<div class="drow"><div class="dl"><b>あ</b><span>a</span></div><div class="sq"><span class="cx"></span><svg viewBox="0 0 109 109"><g style="fill:none;stroke:#1d1a16;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round"><path d="M31.01,33c0.88,0.88,2.75,1.82,5.25,1.75c8.62-0.25,20-2.12,29.5-4.25c1.51-0.34,4.62-0.88,6.62-0.5"/><path d="M49.76,17.62c0.88,1,1.82,3.26,1.38,5.25c-3.75,16.75-6.25,38.13-5.13,53.63c0.41,5.7,1.88,10.88,3.38,13.62"/><path d="M65.63,44.12c0.75,1.12,1.16,4.39,0.5,6.12c-4.62,12.26-11.24,23.76-25.37,35.76c-6.86,5.83-15.88,3.75-16.25-8.38c-0.34-10.87,13.38-23.12,32.38-26.74c12.42-2.37,27,1.38,30.5,12.75c4.05,13.18-3.76,26.37-20.88,30.49"/></g><text x="22.5" y="35.0" font-size="9" fill="#a89e8a">1</text><text x="41.5" y="19.0" font-size="9" fill="#a89e8a">2</text><text x="57.5" y="42.0" font-size="9" fill="#a89e8a">3</text></svg></div><div class="sq"><span class="cx"></span><svg viewBox="0 0 109 109"><g style="fill:none;stroke:#aea493;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 3.6"><path d="M31.01,33c0.88,0.88,2.75,1.82,5.25,1.75c8.62-0.25,20-2.12,29.5-4.25c1.51-0.34,4.62-0.88,6.62-0.5"/><path d="M49.76,17.62c0.88,1,1.82,3.26,1.38,5.25c-3.75,16.75-6.25,38.13-5.13,53.63c0.41,5.7,1.88,10.88,3.38,13.62"/><path d="M65.63,44.12c0.75,1.12,1.16,4.39,0.5,6.12c-4.62,12.26-11.24,23.76-25.37,35.76c-6.86,5.83-15.88,3.75-16.25-8.38c-0.34-10.87,13.38-23.12,32.38-26.74c12.42-2.37,27,1.38,30.5,12.75c4.05,13.18-3.76,26.37-20.88,30.49"/></g></svg></div><div class="sq"><span class="cx"></span><svg viewBox="0 0 109 109"><g style="fill:none;stroke:#aea493;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 3.6"><path d="M31.01,33c0.88,0.88,2.75,1.82,5.25,1.75c8.62-0.25,20-2.12,29.5-4.25c1.51-0.34,4.62-0.88,6.62-0.5"/><path d="M49.76,17.62c0.88,1,1.82,3.26,1.38,5.25c-3.75,16.75-6.25,38.13-5.13,53.63c0.41,5.7,1.88,10.88,3.38,13.62"/><path d="M65.63,44.12c0.75,1.12,1.16,4.39,0.5,6.12c-4.62,12.26-11.24,23.76-25.37,35.76c-6.86,5.83-15.88,3.75-16.25-8.38c-0.34-10.87,13.38-23.12,32.38-26.74c12.42-2.37,27,1.38,30.5,12.75c4.05,13.18-3.76,26.37-20.88,30.49"/></g></svg></div><div class="sq"><span class="cx"></span></div></div><div class="drow"><div class="dl"><b>い</b><span>i</span></div><div class="sq"><span class="cx"></span><svg viewBox="0 0 109 109"><g style="fill:none;stroke:#1d1a16;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round"><path d="M21.5,29.66c2.01,2.17,2.61,4.68,2.17,7.43c-3.09,19.16-1.03,32.01,7.93,41.45c6.12,6.45,6.26,3.14,7.04-5.21"/><path d="M72.96,36.51c9.44,8.05,17.79,18.82,18.41,33.83"/></g><text x="15.0" y="27.1" font-size="9" fill="#a89e8a">1</text><text x="62.2" y="32.9" font-size="9" fill="#a89e8a">2</text></svg></div><div class="sq"><span class="cx"></span><svg viewBox="0 0 109 109"><g style="fill:none;stroke:#aea493;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 3.6"><path d="M21.5,29.66c2.01,2.17,2.61,4.68,2.17,7.43c-3.09,19.16-1.03,32.01,7.93,41.45c6.12,6.45,6.26,3.14,7.04-5.21"/><path d="M72.96,36.51c9.44,8.05,17.79,18.82,18.41,33.83"/></g></svg></div><div class="sq"><span class="cx"></span><svg viewBox="0 0 109 109"><g style="fill:none;stroke:#aea493;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 3.6"><path d="M21.5,29.66c2.01,2.17,2.61,4.68,2.17,7.43c-3.09,19.16-1.03,32.01,7.93,41.45c6.12,6.45,6.26,3.14,7.04-5.21"/><path d="M72.96,36.51c9.44,8.05,17.79,18.82,18.41,33.83"/></g></svg></div><div class="sq"><span class="cx"></span></div></div>
      </div>

      <form id="leadForm" novalidate>
        <label for="email">你的電郵（寄送 PDF 用）</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
               placeholder="name@example.com" required>
        <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" id="sendBtn">寄字帖給我</button>
        <p class="note">只會用來寄這份字帖與日後少量日語學習內容，隨時可以取消訂閱。不會出售你的電郵。</p>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>
    </div>

    <div class="done" id="done">
      <div class="tick">✉️</div>
      <h2>已寄出</h2>
      <p id="doneText">請到收件箱查看；若一分鐘內仍未收到，也請檢查垃圾郵件。</p>
      <p class="sub">等唔到？<a href="downloads/kana-worksheet.pdf">直接下載 PDF</a></p>
    </div>
  </div>

  <iframe name="fsSink" id="fsSink" title="送信中" style="display:none"></iframe>

  <p class="foot">
    <a href="./">← 回到五十音練習</a><br>
    字帖字形來源：KanjiVG（CC BY-SA 4.0）
  </p>
</div>

<script>
/* ── 設定 ─────────────────────────────────────────────────
   FS_EMAIL：FormSubmit 收件電郵。填入後，表單用「原生 POST」送出，
              FormSubmit 會用 _autoresponse 自動回覆一封含 PDF 連結的信。
              注意：FormSubmit 的 AXIOS／AJAX 模式不支援 autoresponse，
              所以這裡刻意用原生表單送出（會短暫跳到 FormSubmit，再返回本站）。
   LEAD_ENDPOINT：自架 Worker（AJAX）用；留空即可。
   ──────────────────────────────────────────────────────── */
const FS_EMAIL = '';                 // 已改用 Worker（AJAX），FormSubmit 停用
const LEAD_ENDPOINT = 'https://kana-lead.kanadojo.workers.dev/api/lead';
const PDF_URL = 'downloads/kana-worksheet.pdf';

const form = document.getElementById('leadForm');
const btn = document.getElementById('sendBtn');
const msg = document.getElementById('msg');
const done = document.getElementById('done');
const formBox = document.getElementById('formBox');

function show(kind, html){
  msg.className = 'msg show ' + kind;
  msg.innerHTML = html;
}

function sent(){
  msg.className = 'msg'; msg.textContent = '';
  formBox.style.display = 'none';
  done.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* FormSubmit 返回本站時顯示成功畫面 */
if(new URLSearchParams(location.search).get('sent') === '1'){ sent(); }

/* 用 FormSubmit：設定 action 與隱藏欄位（_captcha 保持開啟，autoresponse 才有效） */
if(FS_EMAIL && !LEAD_ENDPOINT){
  form.action = 'https://formsubmit.co/' + FS_EMAIL;
  form.method = 'POST';
  form.target = 'fsSink';          // 提交去隱藏 iframe：頁面唔跳走，Safari 唔會卡住
  const hidden = {
    _subject: '你的五十音筆順字帖（下載連結）',
    _template: 'table',
    _autoresponse:
      '多謝索取五十音筆順字帖。\n\n' +
      '下載連結（17 頁 A4 PDF，可直接列印）：\n' +
      'https://alice-creator-lab.github.io/kana-dojo/downloads/kana-worksheet.pdf\n\n' +
      '練習 app：https://alice-creator-lab.github.io/kana-dojo/\n\n' +
      '—— 五十音練習',
    _next: location.origin + location.pathname + '?sent=1',
  };
  Object.entries(hidden).forEach(([name, value])=>{
    const el = document.createElement('input');
    el.type = 'hidden'; el.name = name; el.value = value;
    form.appendChild(el);
  });
}

form.addEventListener('submit', async e=>{
  const email = form.email.value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    e.preventDefault();
    show('err', '電郵格式好像不對，請再檢查一次。');
    form.email.focus();
    return;
  }
  if(form._honey.value){ e.preventDefault(); return; }   // 機械人

  if(FS_EMAIL && !LEAD_ENDPOINT){          // 原生 POST：交給 FormSubmit
    // 提交去隱藏 iframe，頁面留在原地：唔可以 disable 按鈕（Safari 會取消提交）
    btn.textContent = '寄出中…';
    setTimeout(sent, 1400);      // 唔等伺服器回應（跨域讀唔到），樂觀顯示成功
    return;
  }

  e.preventDefault();

  if(!LEAD_ENDPOINT){
    show('err', '自動寄送仲未開通，可以先<a href="' + PDF_URL + '">直接下載字帖</a>；開通後會第一時間通知你。');
    return;
  }

  btn.disabled = true;
  btn.textContent = '寄出中…';
  msg.className = 'msg';

  try{
    const res = await fetch(LEAD_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({email, source: location.pathname, _honey: form._honey.value})
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    sent();
  }catch(err){
    btn.disabled = false;
    btn.textContent = '寄字帖給我';
    show('err', '寄送失敗，請再試一次；如果仍然不行，<a href="' + PDF_URL + '">直接下載字帖</a>。');
  }
});
</script>
